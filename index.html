    <!-- Cloudflare Turnstile Bypass Handler (Controlled by .env: TURNSTILE_ENABLED) -->
    <script>
      (function() {
        function enableBypass() {
          if (!document.getElementById('cf-turnstile-script')) {
            var dummy = document.createElement('script');
            dummy.id = 'cf-turnstile-script';
            document.head.appendChild(dummy);
          }
          window.turnstile = {
            render: function(container, options) {
              if (container && !container.hasChildNodes()) {
                var badge = document.createElement('div');
                badge.style.cssText = 'display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;color:#166534;font-size:12px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,0.05);';
                badge.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> Turnstile Dinonaktifkan (.env)';
                container.appendChild(badge);
              }
              if (options && typeof options.callback === 'function') {
                setTimeout(function() {
                  options.callback('bypass-turnstile-token');
                }, 50);
              }
              return 'bypass-widget-id';
            },
            reset: function() {},
            remove: function() {},
            getResponse: function() { return 'bypass-turnstile-token'; },
            isExpired: function() { return false; }
          };
          var checkCb = setInterval(function() {
            if (typeof window.onloadTurnstileCallback === 'function') {
              try { window.onloadTurnstileCallback(); } catch(e) {}
              clearInterval(checkCb);
            }
          }, 20);
          setTimeout(function() { clearInterval(checkCb); }, 5000);
        }

        if (typeof window.TURNSTILE_ENABLED !== 'undefined') {
          if (!window.TURNSTILE_ENABLED) {
            enableBypass();
          }
          return;
        }

        try {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', '/api/settings.php', false);
          xhr.send(null);
          if (xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            if (data && data.turnstile_enabled === false) {
              window.TURNSTILE_ENABLED = false;
              enableBypass();
            } else {
              window.TURNSTILE_ENABLED = true;
            }
          }
        } catch(e) {}
      })();
    </script>
